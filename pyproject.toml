[project]
name = "causal-evaluation"
version = "0.1.0"
description = "CLadder causal reasoning evaluation graph view"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "openai>=1.0",
  "pandas>=2.1",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
causal-evaluation = "causal_evaluation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causal_evaluation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
